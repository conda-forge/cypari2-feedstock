schema_version: 1

context:
  version: "2.2.9"
  name: cypari2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 92f5af711fc070fec84fde8a425167005a83e0ea07686c36c4d2ac8cafe089cf
  patches:
    - 0001-Find-cysignals-without-executing-import-cysignals.patch
    - 0002-Ignore-homebrew.patch

build:
  number: 1
  skip: win or match(python, "<3.13")

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
        - meson-python
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python-build
    - meson-python
    - cython
    - python
    - pari
    - pip
    - cysignals
    - gmp
  run:
    - python
    - cysignals >=1.11.3

tests:
  - python:
      imports:
        - cypari2
  - package_contents:
      files:
        - lib/python*/site-packages/cypari2/auto_paridecl.pxd
  - script:
      - python -c "import doctest; import cypari2; doctest.testmod(cypari2, optionflags=doctest.ELLIPSIS|doctest.REPORT_NDIFF)"

about:
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: An interface to the number theory library libpari
  homepage: https://github.com/sagemath/cypari2

extra:
  recipe-maintainers:
    - conda-forge/sage
    - maresb
    - isuruf
    - saraedum
